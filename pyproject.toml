[project]
name = "gitwire"
version = "0.1.0"
description = "一个人的开源情报站：盯住 GitHub 仓库，AI 维护情报档案，git 版本化发布"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.40",
    "typer>=0.12",
    "pyyaml>=6.0",
    "anthropic>=1.8.0",
    "cvss>=3.6",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
    "cryptography>=44",
    "alembic>=1.14",
    "email-validator>=2",
]

[project.scripts]
gitwire = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
